services:
  backend:
    build:
      context: ./Backend/FoodApplication/FoodApplication
      dockerfile: Dockerfile
    container_name: foodapp-backend
    environment:
      SERVER_PORT: 8083
      # Use your external Neon DB (set these in a local .env file)
      # Example:
      # SPRING_DATASOURCE_URL=jdbc:postgresql://<neon-host>:5432/<db>?sslmode=require
      # SPRING_DATASOURCE_USERNAME=<user>
      # SPRING_DATASOURCE_PASSWORD=<password>
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      # Optional (only needed if you use email/OTP features locally)
      # SPRING_MAIL_USERNAME: ""
      # SPRING_MAIL_PASSWORD: ""
    ports:
      - "8083:8083"

  frontend:
    build:
      context: ./Frontend/food
      dockerfile: Dockerfile
    container_name: foodapp-frontend
    environment:
      # Browser calls the backend via your host port mapping.
      VITE_API_BASE_URL: http://localhost:8083/
    ports:
      - "5173:5173"
    depends_on:
      - backend
