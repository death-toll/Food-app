<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>food</title>
    <!-- Apply saved theme before React mounts to prevent flash of light mode -->
    <script>
      (function () {
        var t = localStorage.getItem('appTheme') || 'dark';
        document.documentElement.setAttribute('data-bs-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
